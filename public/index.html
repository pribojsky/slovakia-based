<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slovakia Based</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Slovakia Based</h1>
      <p>Decentralized P2P chat</p>
    </header>

    <section id="login">
      <h2>Choose nickname</h2>
      <input id="nickname" maxlength="32" placeholder="Nickname" autocomplete="off">

      <h2>Choose category</h2>

      <div id="categories">
        <button data-category="knives-edc">🔪 Knives & EDC</button>
        <button data-category="cars">🚗 Cars</button>
        <button data-category="gaming">🎮 Gaming</button>
        <button data-category="it-technology">💻 IT & Technology</button>
        <button data-category="music-gear">🎵 Music & Gear</button>
        <button data-category="outdoor">🏕️ Outdoor</button>
        <button data-category="dogs-animals">🐕 Dogs & Animals</button>
        <button data-category="general">💬 General</button>
      </div>
    </section>

    <section id="room" hidden>
      <div class="room-header">
        <div>
          <h2 id="room-name"></h2>
          <span id="connection-status">Connecting...</span>
        </div>
        <button id="leave">Leave</button>
      </div>

      <div class="layout">
        <aside>
          <h3>Online</h3>
          <div id="users"></div>
        </aside>

        <section class="chat">
          <div id="peer-status">Select somebody online.</div>
          <div id="messages"></div>

          <form id="message-form">
            <input id="message" placeholder="Message..." autocomplete="off" disabled>
            <button id="send" type="submit" disabled>Send</button>
          </form>
        </section>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
